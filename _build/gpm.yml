name: 'Digital Signage'
lowCaseName: digitalsignage
description: 'The most powerful and easiest Digital Signage solution for MODX.'
author: Sterc
version: 2.0.0

menus:
  - text: digitalsignage
    description: digitalsignage.desc
    parent: topnav
    action: home
    permission: digitalsignage

systemSettings:
  - key: branding_url
    value: 'https://www.sterc.nl/modx/extras/digital-signage-voor-modx'
    area: digitalsignage
  - key: branding_url_help
    value: 'https://docs.modmore.com/en/DigitalSignage/v1/index.html'
    area: digitalsignage
  - key: auto_create_sync
    type: combo-boolean
    value: 1
    area: digitalsignage
  - key: context
    type: modx-combo-context
    value: ''
    area: digitalsignage
  - key: export_feed_resource
    value: ''
    area: digitalsignage
  - key: export_resource
    value: ''
    area: digitalsignage
  - key: mcp_api_key
    type: text-password
    value: ''
    area: digitalsignage
  - key: media_source
    type: modx-combo-source
    value: 1
    area: digitalsignage
  - key: request_param_broadcast
    value: bc
    area: digitalsignage
  - key: request_param_player
    value: pl
    area: digitalsignage
  - key: request_resource
    value: ''
    area: digitalsignage
  - key: templates
    value: ''
    area: digitalsignage
  - key: editor_menubar
    value: ''
    area: digitalsignage_editor
  - key: editor_plugins
    value: 'advlist autolink code link lists paste visualblocks'
    area: digitalsignage_editor
  - key: editor_statusbar
    type: combo-boolean
    value: 0
    area: digitalsignage_editor
  - key: editor_toolbar1
    value: 'undo redo | bold italic | alignleft aligncenter alignright alignjustify | link unlink | visualblocks pastetext removeformat'
    area: digitalsignage_editor
  - key: editor_toolbar2
    value: ''
    area: digitalsignage_editor
  - key: editor_toolbar3
    value: ''
    area: digitalsignage_editor

snippets:
  - name: DigitalSignage
    file: digitalsignage.snippet.php
  - name: DigitalSignageFeedExport
    file: digitalsignagefeedexport.snippet.php

plugins:
  - name: DigitalSignage
    file: digitalsignage.plugin.php
    events:
      - name: OnHandleRequest
      - name: OnLoadWebDocument
      - name: OnWebPagePrerender

templates:
  - name: 'Digital Signage (2.0.0 original)'
    file: digitalsignage.template.tpl
    icon: icon-play-circle

build:
  readme: core/components/digitalsignage/docs/readme.txt
  changelog: core/components/digitalsignage/docs/changelog.txt
  requires:
    modx: '>=3.0.0'
    php: '>=8.1'
  files:
    - source: '[[+packagePath]]/digitalsignage/'
      target: 'return MODX_BASE_PATH;'
  scriptsAfter:
    - tables.gpm.php
    - tablevalues.gpm.php
    - permissions.gpm.php
